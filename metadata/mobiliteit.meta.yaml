  LLLT_EV: &equivalent_variation_total
    <<: *map_indicator
    title: Welvaartseffecten
    subtitle: Welvaartseffecten van de Lelylijn
    description: "Welvaartseffecten van de Lelylijn, uitgedrukt in 'equivalent variation': het bedrag dat een consument vooraf zou moeten ontvangen of betalen om dezelfde welvaartsverandering te ervaren als door de Lelylijn. Volgens de afspraken binnen het project worden geen absolute waarden getoond. Het kleurverloop geeft aan waar de effecten het grootst en het kleinst zijn."
    legend: Welvaartseffecten
    show_values: false
    test_values: {}

  LLLT_EV_1: &equivalent_variation_low
    <<: *equivalent_variation_total
    title: Welvaartseffecten - opleiding laag
