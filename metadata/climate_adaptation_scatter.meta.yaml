# The input in the yaml metadata files determines how the indicators are shown in the dashboard. 
# It defines which indicators are shown in the dashboard and how each one should be visualized (type of graph, text, classification...)
# Each datafile should have its own corresponding yaml metadata file
# The name of the metadata yaml file should be the same as the data file and end with .meta.yaml

# [Contact person(s) for the data file]
contact: Yashvant Premchand

# [Name of the data file without extension]
dataset_id: data_climate_adaptation 

# [Name of the column that determines the level at which the data is shown]
key: code 

# [Filters / options. The column or columns that determine sub-selections or subpopulations, if applicable]
options:

time_column:

# [Version of the CBS gemeente/wijk/buurt layout]
gwb_version: wijk_gegeneraliseerd_2019

# [Name of the layer in the CBS gwb file containing the geometry]
layer_naam: wijk_gegeneraliseerd_2019

key_gwb: statcode

area_name_field: statnaam

indicators:

  # [Name of indicator. For visualization type "scatter", the names of the involved columns are the names
  # of other indicators which must exist separately. Preferrably in this same meta file.
  correlations:

    # [Short title of indicator no.1 (one or two words)]
    title: Kosten

    # [Longer title of indicator no. 1]
    subtitle: Gemiddelde kosten klimaatadaptatie per vierkante meter nieuwbouw 

    # [Description / explanation of indicator no. 1]
    description: Deze indicator laat verbanden zien tussen indicatoren in de vorm van een scatter plot

    # [Link to publication]
    link: https://papers.tinbergen.nl/25073.pdf 

    # [Title of the legend of indicator no. 1]
    legend:

    # [High-level topic of indicator.]  (voor nu even niet hetzelfde als andere bestaande indicator)
    theme: Klimaatadaptatie
    
    # [Sub-category within the theme of indicator no. 1]
    subject: scatter

    # [Type of visualization:]
    visualization_type: scatterplot

    indicators:
        - costs
        - dist_water_m
    

  # [Name of the column of indicator; 1st of scatter]:
  # for a scatter plot, there must be at least 2 indicators
  costs:

    # [Title of indicator no. 1]
    title: Gemiddelde kosten klimaatadaptatie per vierkante meter nieuwbouw 
    
    # [Longer title of indicator no. 1]
    subtitle: Gemiddelde kosten klimaatadaptatie per vierkante meter nieuwbouw 

    # [Description / explanation of indicator no. 1]
    description: Deze indicator laat zien hoeveel euro per vierkante meter nieuwbouw moet worden geïnvesteerd om de woning te beschermen tegen klimaat-gerelateerde events

    # [Title of the legend of indicator no. 1]
    legend: Euro per vierkante meter 
    
    # [High-level topic of indicator no. 1]
    theme: Klimaatadaptatie

    # [Sub-category within the theme of indicator no. 1]
    subject:

    #De unit die achter de waarde komt te staan in de kaart (bijvoorbeeld: 100 -> 100 euro)
    unit: " euro per vierkanter meter"
    
    # [Number of decimals to display for indicator no. 1]
    precision: 0 
    
    # [Type of visualization:]
    #   Map: a map that the user can hover over to see the value in each neighborhood
    #   Map_with_timegraph_per_area: the map, but the user can click on a neighborhood to see how values evolved over time
    visualization_type: map
    
    # [Link to publication]
    link: https://papers.tinbergen.nl/25073.pdf 

    # [Expected values for 4 reference municipalities, rounded to 2 decimals]
    test_values:
      WK019320: 241.81
      WK197904: 127.25
      WK099503: 266.54
      WK066406: 123.92


  # [Name of the column of indicator; 2nd of scatter]:
  dist_water_m:

    # [Title of indicator no. 2]
    title: Gemiddelde afstand tot water
    
    # [Longer title of indicator no. 2]
    subtitle: Gemiddelde afstand tot water

    # [Description / explanation of indicator no. 1]
    description: Deze indicator laat zien wat de gemiddelde afstand tot water is

    # [Title of the legend of indicator no. 1]
    legend: meter
    
    # [High-level topic of indicator no. 1]
    theme: Klimaatadaptatie

    # [Sub-category within the theme of indicator no. 1]
    subject:

    #De unit die achter de waarde komt te staan in de kaart (bijvoorbeeld: 100 -> 100 euro)
    unit: " meter"
    
    # [Number of decimals to display for indicator no. 1]
    precision: 0 
    
    # [Type of visualization:]
    #   Map: a map that the user can hover over to see the value in each neighborhood
    #   Map_with_timegraph_per_area: the map, but the user can click on a neighborhood to see how values evolved over time
    visualization_type: map
    
    # [Link to publication]
    link:
